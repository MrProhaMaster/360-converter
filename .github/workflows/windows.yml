name: Windows checks and portable build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - name: Install regular application dependencies
        shell: pwsh
        run: |
          python -m venv .runtime-venv
          .runtime-venv/Scripts/python -m pip install .
      - name: Export without external FFmpeg or developer dependencies
        shell: pwsh
        run: .runtime-venv/Scripts/python scripts/check_source_install.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.0'
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Diagnose failed portable build
        if: failure()
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Console -OutputDirectory diagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: Pano360-Windows-x64
          path: dist/Pano360/
          retention-days: 14
