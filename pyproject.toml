[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "360-converter"
version = "1.5.2"
description = "360-конвертер — локальное преобразование панорам в JPEG"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.3,<14", "numpy>=2.3.3,<3", "imageio-ffmpeg==0.8.1"]

[project.urls]
Repository = "https://github.com/MrProhaMaster/360-converter"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.16,<7"]

[project.gui-scripts]
360-converter = "converter_360.gui:main"

[project.scripts]
360-converter-cli = "converter_360.cli:main"

[tool.setuptools.packages.find]
include = ["converter_360*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
